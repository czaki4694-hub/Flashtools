name: Build exe
on: [workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --noconsole --name JoyeuseTool rn9p_flash_tool.py
      - uses: actions/upload-artifact@v4
        with:
          name: JoyeuseTool
          path: dist/JoyeuseTool.exe
